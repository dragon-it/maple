name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # 테스트 실패 시 빌드와 자동 병합으로 진행하지 않음
      - name: Run Jest tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"

  automerge:
    # 같은 PR의 테스트와 빌드가 모두 성공해야 실행함
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 병합 권한을 가진 작업에서는 PR 코드를 checkout하거나 실행하지 않음
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for tooling patches
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
        shell: bash
        run: |
          # 패키지 이름 전체를 비교함. react라는 글자가 포함됐다는 이유로 분류하지 않음
          IFS=',' read -ra dependencies <<< "$DEPENDENCIES"
          if [ "${#dependencies[@]}" -eq 0 ]; then
            echo "Skip: no dependency metadata"
            exit 0
          fi
          for dependency in "${dependencies[@]}"; do
            dependency="$(printf '%s' "$dependency" | xargs)"
            case "$dependency" in
              @eslint/js|eslint|eslint-plugin-react|@testing-library/jest-dom|typescript|concurrently)
                ;;
              *)
                echo "Skip: manual review required for $dependency"
                exit 0
                ;;
            esac
          done

          # 검사 도중 PR 내용이나 대상 브랜치가 바뀌었으면 병합하지 않음
          pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          if ! jq -e --arg sha "$HEAD_SHA" \
            '.state == "open" and .draft == false and .base.ref == "dev" and .head.sha == $sha' \
            <<< "$pr" > /dev/null; then
            echo "Skip: pull request changed since this CI run"
            exit 0
          fi

          # 의존성 파일 이외의 변경은 사람이 검토함
          files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -Evq '^(package\.json|package-lock\.json)$'; then
            echo "Skip: changes outside dependency manifests"
            exit 0
          fi

          # 저장소 설정이 준비되지 않았으면 실패시키거나 강제 병합하지 않음
          repository="$(gh api "repos/$GH_REPO")"
          if ! jq -e '.allow_auto_merge == true and .allow_squash_merge == true' <<< "$repository" > /dev/null; then
            echo "Skip: enable repository auto-merge and squash merging first"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
